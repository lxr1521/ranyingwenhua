<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冉映文化 · 短剧作品</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#111;color:#fff;padding:30px 16px}
        h1{text-align:center;color:#ff3333;margin-bottom:40px;font-size:28px}
        .card{max-width:520px;margin:0 auto;background:#222;border-radius:14px;padding:20px;overflow:hidden}
        .poster{width:100%;border-radius:10px;margin-bottom:16px}
        .title{font-size:22px;font-weight:bold;margin-bottom:10px;color:#fff}
        .desc{color:#ccc;line-height:1.6;margin-bottom:12px}
        .trailer{color:#ff5555;margin:8px 0;display:block}
        .btn{display:block;width:100%;background:#ff3333;color:#fff;text-align:center;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:16px}
        footer{text-align:center;margin-top:40px;color:#888;font-size:14px}
    </style>
</head>
<body>
    <h1>冉映文化·短剧作品</h1>
    <div class="card">
        < img class="poster" src="" alt="萌宝驭灵虫">
        <div class="title">萌宝驭灵虫</div>
        <div class="desc">
            小小萌宝天生能驭万灵虫，全家被陷害流放绝境，萌宝唤出虫群护家人、破阴谋，一路逆袭打脸反派，逆天改命！
        </div>
        <a class="trailer" href="">预告片：点击查看预告片</a >
        <a class="btn" href="">去账号看全集</a >
    </div>
    <footer>©冉映文化 短剧宣传页 | 仅展示引流</footer>
</body>
</html>
