<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>燃影文化 - 短剧展示</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:#111;color:#fff;padding:30px;max-width:1200px;margin:0 auto;}
        h1{text-align:center;margin-bottom:40px;color:#ff5555;}
        .drama-card{background:#222;border-radius:14px;padding:20px;margin-bottom:24px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
        .poster{width:220px;height:320px;border-radius:10px;object-fit:cover;background:#333;}
        .info{flex:1;min-width:280px;}
        .info h2{margin-bottom:10px;color:#ffdddd;}
        .info p{color:#ccc;line-height:1.7;margin-bottom:14px;}
        .link{display:inline-block;padding:10px 20px;background:#ff4444;color:#fff;border-radius:8px;text-decoration:none;margin-top:8px;}
        .footer{text-align:center;margin-top:60px;color:#888;font-size:14px;}
    </style>
</head>
<body>
    <h1>燃影文化 · 短剧作品</h1>

    <div class="drama-card">
        < img class="poster" src="这里替换成海报图片链接" alt="短剧海报">
        <div class="info">
            <h2>短剧名称</h2>
            <p>在这里填写短剧简介、剧情亮点</p >
            <p>预告片：<a href=" " target="_blank" style="color:#ff8888">点击查看预告片</a ></p >
            <a class="link" href="这里填你的抖音/海外账号链接" target="_blank">去账号看全集</a >
        </div>
    </div>

    <div class="footer">© 燃影文化 短剧宣传页 | 仅展示引流</div>
</body>
</html>
